<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Admin QR — Soirée Parfaite & Jean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="acces/acces.css" />
</head>
<body class="page-admin">
  <header class="acces-top">
    <p class="acces-kicker">Organisation</p>
    <h1>QR invités</h1>
    <p class="acces-sub">QR civil / soirée · tri A→Z · suppression possible</p>
  </header>

  <main class="acces-main acces-main-wide">
    <section class="panel">
      <h2 class="panel-title">Récupérer depuis WhatsApp</h2>
      <p class="hint">
        Le message est déjà prérempli : change seulement le nom, le numéro et le type, puis ajoute.
      </p>
      <form class="admin-form" id="wa-import-form">
        <label>
          Message WhatsApp
          <textarea
            id="wa-import-text"
            name="messages"
            rows="10"
          >Bonjour Parfaite &amp; Jean,

Je confirme ma présence à votre mariage.

Nom : 
Événement : Mariage (invitation complète)
Type d’invitation : Couple
WhatsApp : </textarea>
        </label>
        <label>
          Nom complet
          <input id="wa-nom" name="nom" type="text" required placeholder="Prénom Nom" />
        </label>
        <label>
          WhatsApp invité
          <input id="wa-whatsapp" name="whatsapp" type="tel" inputmode="tel" placeholder="Ex. +243…" />
        </label>
        <label>
          Événement
          <select id="wa-evenement" name="evenement">
            <option value="soiree" selected>Soirée dansante</option>
            <option value="civil">Cérémonie civile</option>
          </select>
        </label>
        <label>
          Type
          <select id="wa-type" name="type">
            <option value="singleton">Singleton · 1 personne</option>
            <option value="couple" selected>Couple · 2 personnes</option>
            <option value="collectif">Collectif · à renseigner</option>
          </select>
        </label>
        <label id="wa-count-wrap">
          Nombre de personnes
          <input id="wa-count" name="personnes" type="number" min="1" max="50" value="2" />
        </label>
        <label id="wa-table-wrap">
          Table
          <select id="wa-table" name="table">
            <option value="">— Choisir —</option>
          </select>
        </label>
        <label>
          Code QR <span class="opt">(laisser vide pour en créer un)</span>
          <input id="wa-code" name="code" type="text" placeholder="PJ-XXXXXX" />
        </label>
        <button class="btn btn-gold" type="submit">Ajouter dans la liste</button>
        <p class="form-msg" id="wa-import-msg" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2 class="panel-title">Ajouter un invité</h2>
      <form class="admin-form" id="add-form">
        <label>
          Nom complet
          <input name="nom" type="text" required placeholder="Prénom Nom" />
        </label>
        <label>
          Événement
          <select name="evenement" id="admin-evenement">
            <option value="soiree" selected>Soirée dansante</option>
            <option value="civil">Cérémonie civile</option>
          </select>
        </label>
        <label>
          Type
          <select name="type" id="admin-type">
            <option value="singleton">Singleton · 1 personne</option>
            <option value="couple" selected>Couple · 2 personnes</option>
            <option value="collectif">Collectif · à renseigner</option>
          </select>
        </label>
        <label id="admin-count-wrap">
          Nombre de personnes
          <input name="personnes" id="admin-count" type="number" min="1" max="50" value="2" />
        </label>
        <label>
          Table <span class="opt">(langage / framework)</span>
          <select name="table" id="admin-table">
            <option value="">— Choisir —</option>
          </select>
        </label>
        <label>
          WhatsApp invité <span class="opt">(pour partager le QR)</span>
          <input name="whatsapp" type="tel" inputmode="tel" placeholder="Ex. +243 821 377 353" />
        </label>
        <label>
          Statut
          <select name="statut" id="admin-statut">
            <option value="confirme" selected>Confirmé (RSVP / ajout manuel)</option>
            <option value="invite">Invité (pas encore confirmé)</option>
          </select>
        </label>
        <label>
          Notes <span class="opt">(optionnel)</span>
          <input name="notes" type="text" placeholder="Ex. Ajout manuel WhatsApp" />
        </label>
        <button class="btn btn-gold" type="submit">Ajouter &amp; créer le QR</button>
        <p class="form-msg" id="add-msg" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Liste des QR</h2>
        <div class="panel-actions">
          <a class="btn btn-ghost-dark" href="/api/invites.csv">Export CSV</a>
          <button class="btn btn-ghost-dark" type="button" id="btn-refresh">Actualiser</button>
        </div>
      </div>
      <div class="list-filters">
        <label>
          Filtrer par événement
          <select id="filter-evenement">
            <option value="all">Tous</option>
            <option value="civil">Civil</option>
            <option value="soiree">Soirée</option>
          </select>
        </label>
        <label>
          Filtrer par table
          <select id="filter-table">
            <option value="all">Toutes</option>
            <option value="none">Sans table</option>
          </select>
        </label>
      </div>
      <p class="hint" id="list-status">Chargement…</p>
      <div class="qr-grid" id="qr-grid"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="acces/config.js"></script>
  <script src="acces/api.js"></script>
  <script src="acces/invite-card.js"></script>
  <script src="acces/admin.js"></script>
</body>
</html>
